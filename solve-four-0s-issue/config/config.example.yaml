# ============================================================================
# solve-four-0s-issue 技能配置模板
# ----------------------------------------------------------------------------
# 使用方式：
#   1. 复制为同目录下的 config.yaml：cp config.example.yaml config.yaml
#   2. 填写 projects 下每个项目的本地路径与任务 ID（凭据通常由技能/环境变量提供）
#   3. 执行校验：python3 scripts/scan_leaks.py check
#
# config.yaml 已被 .gitignore 忽略（内含凭据，禁止提交）。
#
# CCA 接口走开放 API（<base_url>/api/v2），请求头带两个鉴权参数
# X-Emp-No（员工号）与 X-Uac-Token。
# 这两个参数按以下优先级获取：
#   1. OpenClaw 注入的环境变量 coclaw_empno / coclaw_token
#      —— 在 OpenClaw 里运行时下面两项可以不配；
#   2. 本技能专用环境变量 FOUR0S_CCA_EMP_NO / FOUR0S_CCA_UAC_TOKEN；
#   3. 本文件的 cca.emp_no / cca.uac_token（同样不要提交）。
# ============================================================================

# CCA 平台与「4个0」判定口径
cca:
  # CCA 平台地址
  base_url: "https://cca.zte.com.cn"
  # CCA 项目 ID（任务链接 /workbench/project/<project_id>/task/... 中的一段）
  project_id: "<project-id>"
  # 员工号（请求头 X-Emp-No）；已由技能/环境变量提供时可留空
  emp_no: "<emp-no>"
  # UAC token（请求头 X-Uac-Token）；已由技能/环境变量提供时可留空
  uac_token: "<uac-token>"

  # Klocwork 相关口径
  kw:
    # 需要清零的优先级
    priorities: ["Critical", "Error"]
    # 只统计以下状态的缺陷（Analyze 表示待分析/未处理）
    status_filter: ["Analyze"]

  # Coverity 相关口径
  coverity:
    # 需要清零的优先级
    priorities: ["High", "Medium"]
    # true 时只统计 classification=Unclassified（未分类）的缺陷
    only_unclassified: true

  # Hub（开源组件漏洞）
  #
  # 最小配置只有两项，都与 KW/Coverity 无关：
  #   cca.hub.project_id —— Hub 任务所在项目，所有微服务共用一个
  #   projects[].hub_id  —— 每个微服务自己的 Hub 任务 ID
  # 配好这两项，技能就会用 CCA 开放 API 下载各任务的报告 zip、解压并解析，
  # 产出「组件名 / 版本 / CVE / Origin id（Maven 坐标）」——即要改哪个 pom 依赖。
  #
  # 注意：Hub 任务与 KW/Coverity 不在同一个 CCA 项目里，任务链接形如
  # https://cca.zte.com.cn/workbench/project/<project_id>/task/<task_id>/executions
  #
  # 下面几项都是「想要更多」时才配：
  #   version_name —— 想同时看版本级数量与 BLOCK/ALARM/PASS 指标（只有数量，没有组件名）
  #   download_dir —— 想指定下载解压位置，实际落点是 <该值 或 output.dir 或当前目录>/hub_download/<project>_<task>/
  hub:
    # 【最小配置】Hub 任务所在项目 ID（所有微服务共用）
    project_id: "<hub-project-id>"
    # 可选：Hub 版本号，写完整版本名；留空则只出组件明细，不查版本级指标
    version_name: ""
    # 可选：自动下载的解压根目录（任务目录固定放在其下的 hub_download/ 里）；留空见上面的默认规则
    download_dir: ""
    # 视为已处置、不计入的修复状态（与平台口径一致）
    ignore_status: ["IGNORED"]

# 需要扫描的项目列表
# 每个项目对应 CCA 上的 Klocwork / Coverity / Hub 任务，可以只配其中几个：
#   任务 ID 取自任务链接 https://cca.zte.com.cn/workbench/project/<project_id>/task/<任务ID>/...
#   Hub 任务在 cca.hub.project_id 指定的项目里（与 KW/Coverity 项目不同），
#   所以 hub_id 只填任务 ID、不要填项目 ID。
projects:
  - name: "<仓库名，需与 CCA 返回文件路径中的仓库目录名一致>"
    local_path: "<本地仓库绝对路径>"
    branch: "develop"                  # 本地仓库需检出并固定的分支
    kw_id: "<Klocwork 任务 ID>"         # 无 Klocwork 任务时留空 ""
    coverity_id: "<Coverity 任务 ID>"   # 无 Coverity 任务时留空 ""
    hub_id: "<Hub 任务 ID>"             # 无 Hub 任务时留空 ""
    enabled: true                      # false 表示本次扫描跳过该项目
  # - name: "another-repo"
  #   local_path: "/path/to/another-repo"
  #   branch: "release_x"
  #   kw_id: ""
  #   coverity_id: "<Coverity 任务 ID>"
  #   hub_id: ""

# 扫描前的本地仓库同步
sync:
  enabled: true              # false 时不 stash/pull/checkout，直接分析当前工作区
  stash_before_pull: true    # 拉取前先 git stash，避免本地改动阻塞
  pull: true                 # 检出配置分支后是否 pull 远端（失败只告警，不中断）
  blame: true                # 是否用 git blame 查询缺陷提交者
  timeout: 180               # 单条 git 命令（fetch/checkout/blame）超时秒数，超时终止并降级
  ssh_keepalive: true        # 给 ssh 加保活参数，避免远端静默时无限等待

# 扫描结果输出（本项可以不配置）
# 留空或缺省时，结果写到执行 scan 命令时的当前目录；
# 需要固定输出位置或指向临时目录时再填绝对路径。
# output:
#   dir: "/path/to/scan-results"

# 网络请求参数
request:
  timeout: 60                # 单次 HTTP 请求超时（秒）
  retries: 2                 # 失败重试次数
